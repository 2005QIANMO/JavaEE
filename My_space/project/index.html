<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>代码项目 - 叶延锦</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", "PingFang SC", -apple-system, sans-serif;
        }
        body {
            background-color: #0a0e1a;
            color: #e5e7eb;
            min-height: 100vh;
            line-height: 1.7;
        }

        /* 导航栏 */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px 48px;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            background: rgba(10, 14, 26, 0.85);
            backdrop-filter: blur(12px);
        }
        .nav-links {
            display: flex;
            gap: 36px;
        }
        .nav-links a {
            color: #d1d5db;
            text-decoration: none;
            font-size: 16px;
            transition: color 0.3s;
            position: relative;
        }
        .nav-links a:hover,
        .nav-links a.active {
            color: #60a5fa;
        }
        .nav-links a.active::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 0;
            width: 100%;
            height: 2px;
            background: #60a5fa;
        }
        .hamburger {
            font-size: 22px;
            cursor: pointer;
            color: #d1d5db;
        }

        /* 页面主体 */
        .main {
            max-width: 960px;
            margin: 0 auto;
            padding: 120px 48px 60px;
        }
        .page-title {
            font-size: 42px;
            font-weight: 700;
            color: #f0f6fc;
            margin-bottom: 8px;
        }
        .page-subtitle {
            font-size: 14px;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 48px;
        }

        /* 仓库平台分组 */
        .platform-group {
            margin-bottom: 40px;
        }
        .platform-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px 20px;
            background: rgba(30, 41, 59, 0.45);
            border: 1px solid rgba(96, 165, 250, 0.2);
            border-radius: 12px 12px 0 0;
            border-bottom: none;
        }
        .platform-icon {
            font-size: 20px;
        }
        .platform-name {
            font-size: 18px;
            font-weight: 600;
            color: #f0f6fc;
        }
        .platform-link {
            margin-left: auto;
            font-size: 13px;
            color: #60a5fa;
            text-decoration: none;
        }
        .platform-link:hover {
            text-decoration: underline;
        }

        /* 仓库列表 */
        .repo-list {
            border: 1px solid rgba(96, 165, 250, 0.15);
            border-radius: 0 0 12px 12px;
            overflow: hidden;
        }
        .repo-item {
            display: flex;
            align-items: center;
            padding: 16px 24px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            transition: background 0.2s;
            text-decoration: none;
            color: #e5e7eb;
        }
        .repo-item:last-child {
            border-bottom: none;
        }
        .repo-item:hover {
            background: rgba(96, 165, 250, 0.05);
        }
        .repo-name {
            font-size: 16px;
            color: #60a5fa;
            font-weight: 500;
        }
        .repo-desc {
            margin-left: 20px;
            font-size: 14px;
            color: #9ca3af;
        }
        .repo-arrow {
            margin-left: auto;
            color: #6b7280;
            font-size: 16px;
        }

        /* 页脚 */
        footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 28px 48px;
            border-top: 1px solid rgba(255,255,255,0.06);
            font-size: 13px;
            color: #6b7280;
            margin-top: 60px;
        }
        footer a {
            color: #6b7280;
            text-decoration: none;
            margin-left: 20px;
        }
        footer a:hover {
            color: #60a5fa;
        }

        @media (max-width: 768px) {
            .main { padding: 100px 24px 40px; }
            .page-title { font-size: 32px; }
            nav { padding: 16px 24px; }
            .nav-links { gap: 20px; }
            .repo-desc { display: none; }
        }
    </style>
</head>
<body>

                    <span class="repo-desc">Java SE / JavaEE 学习与练习</span>
                    <span class="repo-arrow">→</span>

                <a href="https://gitee.com/qianmo1124/training-code" target="_blank" class="repo-item">

            </div>
            <div class="repo-list">
                <a href="https://github.com/2005QIANMO/JavaEE" target="_blank" class="repo-item">
                    <span class="repo-name">JavaEE</span>
                    <span class="repo-desc">Java Web 开发练习项目</span>
                    <span class="repo-arrow">→</span>
                </a>
            </div>
        </div>
    </div>

    <footer>
        <div>© 2026 叶延锦 · 个人主页</div>
        <div>
            <a href="../Entrypoint.html">首页</a>
            <a href="../blog/index.html">博客记录</a>
            <a href="index.html">代码项目</a>
            <a href="../images/photos.html">相册</a>

</body>
</html>
